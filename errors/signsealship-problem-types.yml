format_note: >-
  NOT RFC 9457. Every documented error response is media type application/json carrying the
  components.schemas.Error shape -- a single object with one string member, `error`. There is no
  application/problem+json, no `type` URI, no `title`, no `status` member and no `instance`, so
  an agent has nothing machine-stable to branch on except the HTTP status code and, for the
  passport verify endpoints, a `verdict` enum. Adopting RFC 9457 with stable type URIs is the
  single largest error-handling improvement available here.
envelope:
  media_type: application/json
  schema: '#/components/schemas/Error'
  shape: '{ "error": "<human sentence>" }'
  exceptions:
  - endpoints:
    - GET /api/verify/room/{verifyCode}
    - GET /api/passport/verify/{code}
    shape: '{ "verdict": "unknown" }'
    note: >-
      The public verification endpoints answer an unknown OR malformed code with an identical
      generic 404 carrying a verdict enum rather than the Error envelope. The sameness is
      deliberate -- it stops the endpoint being used to probe which codes exist.
