auth:
  management: >-
    Partner bearer key OR the dashboard session cookie (__Host-session). Requires
    webhooks:read / webhooks:write per the operation descriptions.
  outbound: HMAC signature over the timestamped payload; the secret is shown exactly once.
operator_affordances:
- affordance: Signed test event
  operation: POST /api/partner/webhooks/{id}/test
- affordance: Signature verification recipe
  operation: GET /api/partner/webhooks/signature-example
  note: >-
    The API itself serves the verification recipe, and the docs publish working Node and Python
    verifier code. That is a materially better developer experience than most webhook surfaces.
- affordance: Delivery replay
  operation: POST /api/partner/webhooks/deliveries/{deliveryId}/replay
  note: Returns the NEW delivery's id plus replayedFrom.
- affordance: Cross-subscription delivery inspection
  operation: GET /api/partner/webhooks/deliveries?topic=
inbound_webhooks:
  note: >-
    Inbound vendor events (payments, notary sessions, shipping, mail) must pass signature
    verification before processing; if a vendor's verification is not configured the route does
    not exist in production. Fail closed, documented at https://signsealship.com/security.
plan_gate: >-
  Partner webhooks unlock at the $149/mo Pro Office tier. Partner Link explicitly does not
  include them.
gaps:
