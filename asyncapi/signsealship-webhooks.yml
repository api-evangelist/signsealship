asyncapi_note: >-
  No AsyncAPI document is published. Probed https://signsealship.com/asyncapi.yaml (404),
  /asyncapi.json (404) and https://docs.signsealship.com/asyncapi.yaml (404) on 2026-09-01. The
  event surface is real and well documented in prose and in the OpenAPI management operations,
  but the OpenAPI declares no top-level `webhooks:` block at all -- so the event payloads exist only
  as documentation, never as a machine-readable contract. Publishing an AsyncAPI 3.0 document,
  or simply filling the OpenAPI 3.1 `webhooks:` block the spec already has room for, would make
  this surface machine-consumable at near-zero cost.
surface: webhooks
transport: HTTPS POST
delivery:
  method: POST
  content_type: application/json
  url_requirement: >-
    https only. A non-https URL is rejected with 400 {"error": "A https:// webhook URL is
    required."}
  headers:
  - name: SignSealShip-Signature
    format: 't=<unix seconds>,v1=<hex hmac>'
    note: >-
      During a 24-hour rotation overlap the header carries one v1 entry per active secret;
      accept the delivery when ANY v1 entry matches.
  - name: SignSealShip-Event
    note: Names the event topic.
  deduplication: >-
    Order-event ids are deterministic -- {topic}:{orderCode} -- so a redelivery deduplicates
    cleanly on the consumer side.
  payload_retention: >-
    Event payload bodies are never stored and never returned by the delivery-inspection
    endpoints; only attempt metadata is retained.
topic_count: 7
topics:
