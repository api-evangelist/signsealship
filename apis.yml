aid: signsealship
name: SignSealShip Partner API
type: Index
description: E-signature, remote online notarization coordination, document verification and physical delivery in one workflow.
  The API covers onboarding, orders, closing rooms, closing passports, proof passports, webhooks and a sandbox. Also indexes
  a free CC BY 4.0 dataset of remote online notarization requirements for all 51 U.S. jurisdictions.
