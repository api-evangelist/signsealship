- aid: signsealship.com:ron-laws-dataset
  name: Remote online notarization requirements by U.S. jurisdiction
  description: 'Statute-cited remote online notarization requirements for all 50 U.S. states and the District of Columbia:
    effective date, notary fee cap, identity-verification standard, record-retention period, signer-location rule and document
    exclusions. Every value carries its own primary-source citation. Published under CC BY 4.0 and archived at Zenodo (DOI
    10.5281/zenodo.22213684). Values are reported as the cited sources state them and are not legal advice.'
