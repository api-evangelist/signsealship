observations:
- >-
  Money is expressed in integer cents throughout (subtotalCents, discountCents, totalCents,
  amountCents) with no currency member on any schema -- USD is implicit. A consumer cannot read
  the currency out of a response.
- >-
  Two schemas declare no properties at all: OrderServices and CallJoinResponse. They are
  referenced but empty, so a generator produces a bare object for each and a consumer learns
  nothing about the join-call response shape or the services object.
- >-
  There is no Partner resource schema. The account exists as a scope on every read but is never
  itself a readable entity.
- >-
  Timestamps are consistently ISO 8601 date-time and consistently UTC-named (…AtUtc on the
  evidence surfaces, plain createdAt/updatedAt elsewhere) -- a minor naming inconsistency across
  two families of schemas.
