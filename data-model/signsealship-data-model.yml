note: >-
  Relationships are derived two ways: from explicit $ref links between schemas, and from
  code-reference fields (roomCode, orderCode, verifyCode, passportId) that carry a foreign key by
  value rather than by $ref. The second kind dominates -- this API relates records through
  opaque public codes, which are simultaneously identifiers AND bearer credentials.
identifier_model:
  note: >-
    THE CENTRAL DESIGN FACT: in this API an identifier IS an authorization. Possession of a room
    code, an order code or a verify code is the credential for the public endpoints that read it.
    That is why they are high-entropy, why rotation exists, and why an unknown code and another
    partner's code return the identical 404.
  identifiers:
  - name: orderCode
    entity: Order
    shape: public code returned by the create response
    is_credential: true
    note: Authorizes attaching the order to a room.
  - name: roomCode
    entity: ClosingRoom
    shape: 40 lowercase hex characters; the public read endpoint accepts 24-64
    is_credential: true
    rotatable: true
    rotation_operation: POST /api/rooms/{roomCode}/rotate
  - name: verifyCode
    entity: ClosingPassport / ProofPassport
    shape: 26 lowercase base32 characters (128 bits)
    is_credential: true
    note: Bearer for public verification and for the sealed PDF download.
  - name: passportId
    entity: ProofPassport
    shape: uuid
    is_credential: false
    note: Partner-scoped; the private handle, as opposed to the public verifyCode.
  - name: id
    entity: WebhookSubscription
    is_credential: false
  - name: deliveryId
    entity: WebhookDelivery
    is_credential: false
  - name: external_reference
    entity: Order
    shape: partner-supplied correlation string
    is_credential: false
    note: >-
      The only consumer-controlled key in the model. Echoed on order responses and on every order
      webhook event, and filterable on GET /api/partner/orders.
