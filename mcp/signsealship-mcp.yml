scope: documentation-search
scope_note: >-
  This is the Mintlify documentation-search MCP server that ships with the provider's Mintlify
  docs site, not an MCP interface onto the SignSealShip Partner API. Its two tools search and
  read the docs corpus; none of them create an order, seal a passport, or call any of the 39
  Partner API operations. An agent connected to this server can LEARN the API but cannot USE it.
host_note: >-
  The endpoint resolves to a *.mintlify.me preview hostname rather than a signsealship.com host.
  It is nevertheless the provider's own declared server: docs.signsealship.com -- the
  documentation host named in the provider's /.well-known/apis.json -- publishes
  /.well-known/mcp.json naming exactly this URL, and the server identifies itself as
  "SignSealShip Docs". A preview-subdomain endpoint is a fragile public address: it is not under
  the provider's DNS control and can change when the docs project is renamed or redeployed.
