- name: query_docs_filesystem_sign_seal_ship_docs
  category: documentation
  description: >-
    Read-only shell-like query (rg, grep, find, tree, ls, cat, head, tail, jq and friends)
    against a virtualized in-memory filesystem containing only the SignSealShip docs pages and
    OpenAPI specs. Stateless per call. Used to read a page by .mdx path.
  annotations:
    readOnlyHint: true
