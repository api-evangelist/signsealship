    partner_webhooks: false
    order_api: false
  quota: 5 active Closing Rooms
  notes: >-
    B2B per-document rates and a branded intake link. Explicitly does NOT include partner
    webhooks or the Order API. Client analytics dashboard is a +$99/mo add-on at this tier.
  url: https://signsealship.com/pricing
