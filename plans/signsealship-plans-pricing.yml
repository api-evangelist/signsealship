usage_pricing:
  note: >-
    Per-document prices as published on the pricing page on 2026-09-01. Quotes are itemized
    before payment; the notary fee is passed through at cost and never varies by document type,
    and government fees and postage are never marked up or discounted.
  base_services:
  - service: E-signature
    from: 12
    detail: Up to 4 signers who never pay; ESIGN and UETA compliant; SHA-256 audit trail.
  - service: Remote online notarization
    from: 49
    detail: First seal and identity verification included; live commissioned notary, 24/7.
  - service: Sign / Seal / Ship (full service)
    from: 61.95
    detail: Notarized and delivered, tracked.
  - service: Out-of-State Seller Package
    from: 129
    detail: Plus delivery. Real-estate flagship package.
  delivery:
  - service: Print and mail
    price: 12.95
    detail: Flat. Three mail classes -- Standard, Certified (USPS proof of delivery), Certified + return receipt.
  - service: Carrier shipping
    price: 14.95
    detail: Handling fee plus live-rated postage passed through at the quoted carrier rate.
  add_ons:
  - name: Rush handling
    price: 19.95
  - name: Extra signer
    price: 15
  - name: Extra seal
    price: 15
  - name: Witness on demand
    price: 19
  - name: Overnight handling
    price: 14.95
  - name: Scan-back to a partner on sealing
    price: 19
  - name: Secure vault (1 year of re-download)
    price: 9.95
  - name: Fax delivery with sealed transmission certificate
    price: 9.00
discounts:
  note: >-
    Percentage and fixed-amount discount codes were added 2026-08-01. They apply at quote time,
    redeem exactly once when payment clears, and appear on quotes and orders as a negative-amount
    `Discount` line.
billing_integration:
  processor: Stripe
  mechanism: >-
    POST /api/partner/orders/{code}/checkout mints a Stripe hosted-checkout URL. Minting never
    changes order state -- state advances only via the verified Stripe webhook after payment
    clears.
api_pricing_gate: >-
  The Order API and partner webhooks are gated at the $149/mo Pro Office tier. A trial key can
  exercise the sandbox order lifecycle but cannot create a live order.
