- name: Trial key
  price: 0
  billing_period: none
  included:
    active_closing_rooms: 5
    api_access: sandbox only
  quota: 5 active Closing Rooms
  notes: >-
    Issued instantly by POST /api/partner/request when the work email domain and use case
    qualify; otherwise queued for human review. Both outcomes return HTTP 200, so the status code
    does not tell you which happened -- the key arrives by email, once.
  url: https://signsealship.com/partner
- name: Partner Link
  price: 49
  currency: USD
