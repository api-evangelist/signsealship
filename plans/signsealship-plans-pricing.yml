currency: USD
model: >-
  Two stacked models. Every document is priced per use on an itemized receipt -- notary fee
  passed through at cost, platform fees on separate disclosed lines, postage rated live from the
  carrier and never marked up. On top of that, optional monthly partner plans buy a workflow-fee
  discount, a Closing Room quota and, at Pro Office and above, API capability. There is no free
  live tier: public verification and room-lookup reads are free and keyless forever, and a trial
  key gives sandbox access, but creating a live order requires payment.
plan_count: 4
