verifiability_claim: >-
  The distinguishing posture of this trust center is that its central security claim is
  independently checkable by the reader without trusting the vendor: open a sealed PDF in free
  Adobe Reader and inspect the signature panel. Very few trust centers of any size offer a
  reader-executable proof in place of a badge.
