finding: >-
  SignSealShip ships NO client libraries in any language. Integration is raw HTTP against a
  39-operation OpenAPI 3.1 spec -- which is a defensible choice for an API this small, and the
  spec is good enough to generate from. Two things block generation from being a clean substitute
  for a hand-written SDK: not one operation declares an operationId, so every generated client
  invents its own method names, and the order-creation request is multipart/form-data, which most
  generators handle poorly. Reserving the org name on GitHub while publishing nothing to it is
  itself a signal -- the intent to ship code exists and has not been acted on.
