domain_standard_conformance:
  market: document execution, notarization and evidence
  regime: >-
    US electronic signature and remote online notarization -- ESIGN Act (15 U.S.C. 7001), UETA,
    and state RON statutes -- over a cryptographic document-evidence stack.
  standards:
  - id: rfc3161
    name: RFC 3161 Time-Stamp Protocol
    conforms: true
    declared_in_contract: true
    evidence: >-
      components.schemas.ProofSealResponse.timestamps.rfc3161 is a first-class response object
      with `authority` and `timestampedAtUtc` members, explicitly nullable "when the authority
      could not be reached". The contract does not merely claim timestamping -- it returns the
      timestamping authority and the UTC instant as structured data a consumer can verify.
    spec_location: '#/components/schemas/ProofSealResponse/properties/timestamps/properties/rfc3161'
  - id: opentimestamps
    name: OpenTimestamps (Bitcoin-anchored timestamping)
    conforms: true
    declared_in_contract: true
    evidence: >-
      components.schemas.ProofSealResponse.timestamps.openTimestamps returns `calendar`,
      `submittedAtUtc` and `status` (example "pending"). An independent, non-vendor anchor
      published alongside the RFC 3161 one -- two mutually independent timestamp authorities on
      the same seal.
    spec_location: '#/components/schemas/ProofSealResponse/properties/timestamps/properties/openTimestamps'
  - id: cms-pkcs7
    name: CMS / PKCS#7 detached PDF signature (the ISO 32000 PDF signature mechanism)
    conforms: true
    declared_in_contract: partial
    evidence: >-
      The contract returns docSha256 (SHA-256 of the exact uploaded bytes, pre-seal) and
      sealedSha256 (SHA-256 of the sealed PDF) on every seal, and POST /api/passport/seal is
      documented as returning a PDF sealed with Google Cloud KMS. The signature mechanism itself
      -- a CMS (PKCS#7) signature covering the PDF ByteRange, validating in any standards-
      compliant PDF reader -- is stated at https://signsealship.com/security rather than in the
      spec. The verification claim is independently checkable by the reader without SignSealShip.
  - id: sha256-hash-chain
    name: Hash-linked append-only evidence chain
    conforms: true
    declared_in_contract: true
    evidence: >-
      components.schemas.PassportSealResponse declares manifestSha256 and prevManifestSha256
      (null on version 1), and RoomPassportVerification declares chainOk, documented as
      "Recomputed every call: the stored manifest re-hashes to manifestSha256 AND the chain link
      is intact." The verdict is recomputed per request, never a stored boolean.
    spec_location: '#/components/schemas/PassportSealResponse, #/components/schemas/RoomPassportVerification'
  - id: esign-ueta
    name: ESIGN Act 101(c) consent and UETA record integrity
    conforms: claimed
    declared_in_contract: partial
    evidence: >-
      OrderDetail carries an `Esign` status value, and the consent record, ESIGN 101(c) timestamp
      and event timeline are described at https://signsealship.com/security and on the
      Certificate of Completion. This is a statutory regime rather than a wire standard, so it is
      recorded as a claim substantiated by published architecture, not as a machine-checkable
      conformance.
  - id: ron-state-statutes
    name: State remote online notarization statutes
    conforms: claimed
    declared_in_contract: false
    evidence: >-
      Deterministic state-and-document eligibility rules are checked before payment and
      restricted combinations are refused. SignSealShip additionally publishes the underlying
      requirements for all 51 US jurisdictions as a free CC BY 4.0 dataset with a statute
      citation per value (https://signsealship.com/ron-laws.json, HTTP 200, archived at Zenodo
      DOI 10.5281/zenodo.22213684) -- an unusually strong, independently checkable substantiation
      of a compliance claim.
  note: >-
    REWARD-ONLY, and genuinely earned here. The document-evidence market has real machine
    standards -- RFC 3161, OpenTimestamps, CMS/PKCS#7 over ISO 32000 ByteRange -- and this
    contract names two of them as structured response objects rather than as marketing prose. A
    consumer who already speaks RFC 3161 can validate a SignSealShip seal with no bespoke
    connector.
certifications:
  soc2_type2: not certified -- stated as roadmap at https://signsealship.com/security
  iso27001: not certified -- explicitly disclaimed at https://signsealship.com/security
  pci: not claimed; card data is entered directly with Stripe and never reaches SignSealShip servers
  hipaa: not claimed
  fedramp: not claimed
  note: >-
    The provider publishes an "honest table" that marks SOC 2 Type II as roadmap and ISO 27001 as
    not held, with the line "If it isn't marked 'built in' here, we don't claim it anywhere."
    NO CERTIFICATION IS PUBLISHED, so no Compliance pointer is emitted for this provider -- the
    trust center is real, the certifications are not.
